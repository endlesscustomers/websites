<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Competitor evidence translated into a priority</title>
  <desc id="desc">An illustrative benchmark table highlights proof and pricing gaps, which lead to a finding and a first priority.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#1d2129" flood-opacity=".11"/></filter>
  </defs>
  <g font-family="Arial, sans-serif">
    <g transform="translate(45 50)" filter="url(#shadow)">
      <rect width="720" height="665" rx="14" fill="#fff"/>
      <text x="42" y="58" fill="#0f63e0" font-size="12" font-weight="700" letter-spacing="1.8">COMPETITIVE BENCHMARK</text>
      <text x="42" y="101" fill="#0a0f1f" font-size="27" font-weight="700">Where Buyers See a Difference</text>
      <g transform="translate(42 139)">
        <rect width="636" height="48" fill="#f4f5f7"/>
        <text x="14" y="29" fill="#626974" font-size="11" font-weight="700">GRADED AREA</text>
        <text x="294" y="29" fill="#0f63e0" font-size="11" font-weight="700">YOUR COMPANY</text>
        <text x="423" y="29" fill="#626974" font-size="11" font-weight="700">COMP A</text>
        <text x="528" y="29" fill="#626974" font-size="11" font-weight="700">COMP B</text>
        <g font-size="14">
          <rect y="48" width="636" height="57" fill="#fff"/><rect x="276" y="48" width="118" height="57" fill="#fff0f0"/>
          <text x="14" y="82" fill="#343a44">Pricing clarity</text><text x="329" y="83" fill="#d42020" font-size="18" font-weight="700">D</text><text x="449" y="83" fill="#0a0f1f" font-size="18" font-weight="700">B</text><text x="554" y="83" fill="#0a0f1f" font-size="18" font-weight="700">B+</text>
          <rect y="105" width="636" height="57" fill="#fff"/><rect x="276" y="105" width="118" height="57" fill="#fff0f0"/>
          <text x="14" y="139" fill="#343a44">Customer proof</text><text x="319" y="140" fill="#d42020" font-size="18" font-weight="700">C−</text><text x="439" y="140" fill="#0a0f1f" font-size="18" font-weight="700">A−</text><text x="554" y="140" fill="#0a0f1f" font-size="18" font-weight="700">B</text>
          <rect y="162" width="636" height="57" fill="#fff"/><rect x="276" y="162" width="118" height="57" fill="#e7f0ff"/>
          <text x="14" y="196" fill="#343a44">Search visibility</text><text x="321" y="197" fill="#0f63e0" font-size="18" font-weight="700">B+</text><text x="449" y="197" fill="#0a0f1f" font-size="18" font-weight="700">B</text><text x="554" y="197" fill="#0a0f1f" font-size="18" font-weight="700">B</text>
          <rect y="219" width="636" height="57" fill="#fff"/><rect x="276" y="219" width="118" height="57" fill="#e7f0ff"/>
          <text x="14" y="253" fill="#343a44">Education quality</text><text x="326" y="254" fill="#0f63e0" font-size="18" font-weight="700">B</text><text x="449" y="254" fill="#0a0f1f" font-size="18" font-weight="700">B</text><text x="554" y="254" fill="#0a0f1f" font-size="18" font-weight="700">C</text>
        </g>
      </g>
      <g transform="translate(42 485)">
        <text fill="#626974" font-size="12" font-weight="700" letter-spacing="1.5">WHAT THE PATTERN SHOWS</text>
        <circle cx="12" cy="50" r="10" fill="#d42020"/>
        <text x="34" y="55" fill="#0a0f1f" font-size="16" font-weight="700">Trust breaks at the moment buyers compare.</text>
        <circle cx="12" cy="92" r="10" fill="#0f63e0"/>
        <text x="34" y="97" fill="#0a0f1f" font-size="16" font-weight="700">Visibility is not the first constraint.</text>
      </g>
    </g>
    <g transform="translate(817 128)">
      <path d="M-52 229H-5" stroke="#0f63e0" stroke-width="3" stroke-linecap="round"/><path d="m-16 220 12 9-12 9" fill="none" stroke="#0f63e0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect width="336" height="218" rx="14" fill="#e7f0ff"/>
      <text x="28" y="40" fill="#0f63e0" font-size="12" font-weight="700" letter-spacing="1.6">FINDING</text>
      <text x="28" y="81" fill="#0a0f1f" font-size="22" font-weight="700">Competitors Are Easier</text>
      <text x="28" y="108" fill="#0a0f1f" font-size="22" font-weight="700">to Verify and Trust</text>
      <text x="28" y="150" fill="#343a44" font-size="15">Their pricing and customer proof</text>
      <text x="28" y="174" fill="#343a44" font-size="15">answer the questions yours leaves open.</text>
    </g>
    <g transform="translate(817 392)">
      <rect width="336" height="244" rx="14" fill="#0a0f1f"/>
      <text x="28" y="42" fill="#22c55e" font-size="12" font-weight="700" letter-spacing="1.6">PRIORITY 01</text>
      <text x="28" y="84" fill="#fff" font-size="22" font-weight="700">Fix Proof and Pricing</text>
      <text x="28" y="111" fill="#fff" font-size="22" font-weight="700">Before Adding Traffic</text>
      <path d="M28 140H308" stroke="#343a44"/>
      <text x="28" y="173" fill="#d6dae0" font-size="14">Revenue lever</text>
      <text x="28" y="199" fill="#fff" font-size="16" font-weight="700">Close rate + sales-cycle speed</text>
      <text x="28" y="224" fill="#22c55e" font-size="13" font-weight="700">FIRST 90 DAYS</text>
    </g>
  </g>
</svg>
