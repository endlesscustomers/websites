<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Thirteen-area diagnostic system map</title>
  <desc id="desc">Thirteen diagnostic areas grouped into market context, visibility and trust, and buying experience, with 124 inspection points feeding a short priority list.</desc>
  <defs>
    <linearGradient id="brandline" x1="0" x2="1"><stop stop-color="#c026d3"/><stop offset=".5" stop-color="#1c78ff"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1d2129" flood-opacity=".1"/></filter>
  </defs>
  <rect x="22" y="22" width="1156" height="746" rx="24" fill="#f4f5f7"/>
  <rect x="22" y="22" width="1156" height="6" rx="3" fill="url(#brandline)"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="88" fill="#0f63e0" font-size="13" font-weight="700" letter-spacing="2">THE INVESTIGATION</text>
    <text x="70" y="138" fill="#0a0f1f" font-size="31" font-weight="700">13 Areas Across the Customer Journey</text>
    <text x="70" y="171" fill="#626974" font-size="15">Breadth reveals the pattern. Judgment determines the priority.</text>
    <g transform="translate(882 70)">
      <text x="0" y="50" fill="#0a0f1f" font-size="58" font-weight="700">124</text>
      <text x="3" y="75" fill="#626974" font-size="13" font-weight="700" letter-spacing="1.4">INSPECTION POINTS</text>
    </g>
  </g>
  <g transform="translate(70 224)" font-family="Arial, sans-serif">
    <g filter="url(#soft)">
      <rect width="322" height="392" rx="14" fill="#fff"/>
      <rect width="322" height="7" rx="4" fill="#c026d3"/>
      <text x="26" y="49" fill="#a21db2" font-size="12" font-weight="700" letter-spacing="1.6">MARKET CONTEXT</text>
      <text x="26" y="81" fill="#0a0f1f" font-size="21" font-weight="700">Understand the field</text>
      <g transform="translate(26 112)" font-size="14" fill="#343a44">
        <circle cx="7" cy="8" r="4" fill="#c026d3"/><text x="22" y="13">What you do and who you serve</text>
        <circle cx="7" cy="57" r="4" fill="#c026d3"/><text x="22" y="62">Competitors and market</text>
        <circle cx="7" cy="106" r="4" fill="#c026d3"/><text x="22" y="111">How buyers choose</text>
        <circle cx="7" cy="155" r="4" fill="#c026d3"/><text x="22" y="160">Offer and promise superiority</text>
      </g>
      <path d="M26 305H296" stroke="#e8eaed"/>
      <text x="26" y="339" fill="#626974" font-size="13">What your buyer can compare</text>
      <text x="26" y="363" fill="#0a0f1f" font-size="15" font-weight="700">before they ever contact you</text>
    </g>
    <g transform="translate(342)" filter="url(#soft)">
      <rect width="322" height="392" rx="14" fill="#fff"/>
      <rect width="322" height="7" rx="4" fill="#1c78ff"/>
      <text x="26" y="49" fill="#0f63e0" font-size="12" font-weight="700" letter-spacing="1.6">VISIBILITY &amp; TRUST</text>
      <text x="26" y="81" fill="#0a0f1f" font-size="21" font-weight="700">Earn consideration</text>
      <g transform="translate(26 112)" font-size="14" fill="#343a44">
        <circle cx="7" cy="8" r="4" fill="#1c78ff"/><text x="22" y="13">Search and AI visibility</text>
        <circle cx="7" cy="50" r="4" fill="#1c78ff"/><text x="22" y="55">Review authority and reputation</text>
        <circle cx="7" cy="92" r="4" fill="#1c78ff"/><text x="22" y="97">Education quality</text>
        <circle cx="7" cy="134" r="4" fill="#1c78ff"/><text x="22" y="139">Pricing clarity</text>
        <circle cx="7" cy="176" r="4" fill="#1c78ff"/><text x="22" y="181">Customer and social proof</text>
        <circle cx="7" cy="218" r="4" fill="#1c78ff"/><text x="22" y="223">People positioning</text>
      </g>
      <path d="M26 347H296" stroke="#e8eaed"/>
      <text x="26" y="377" fill="#0a0f1f" font-size="15" font-weight="700">Why buyers believe you</text>
    </g>
    <g transform="translate(684)" filter="url(#soft)">
      <rect width="322" height="392" rx="14" fill="#fff"/>
      <rect width="322" height="7" rx="4" fill="#22c55e"/>
      <text x="26" y="49" fill="#15803d" font-size="12" font-weight="700" letter-spacing="1.6">BUYING EXPERIENCE</text>
      <text x="26" y="81" fill="#0a0f1f" font-size="21" font-weight="700">Make action easier</text>
      <g transform="translate(26 112)" font-size="14" fill="#343a44">
        <circle cx="7" cy="8" r="4" fill="#22c55e"/><text x="22" y="13">Website experience</text>
        <text x="22" y="34">and AI accessibility</text>
        <circle cx="7" cy="77" r="4" fill="#22c55e"/><text x="22" y="82">Conversion ease</text>
        <circle cx="7" cy="126" r="4" fill="#22c55e"/><text x="22" y="131">Post-contact sales experience</text>
      </g>
      <path d="M26 305H296" stroke="#e8eaed"/>
      <text x="26" y="339" fill="#626974" font-size="13">What happens when interest</text>
      <text x="26" y="363" fill="#0a0f1f" font-size="15" font-weight="700">turns into a buying decision</text>
    </g>
  </g>
  <g transform="translate(245 665)" font-family="Arial, sans-serif">
    <path d="M0 0H710" stroke="url(#brandline)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="355" cy="0" r="22" fill="#0a0f1f"/>
    <path d="M346 -1l6 7 13-15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="199" y="53" fill="#0a0f1f" font-size="19" font-weight="700">A shorter list of priorities your team can defend</text>
  </g>
</svg>
