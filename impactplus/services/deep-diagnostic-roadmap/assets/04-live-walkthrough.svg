<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Live coach-led roadmap walkthrough</title>
  <desc id="desc">An illustrative live presentation showing a coach, leadership participants, and a shared roadmap page with a recommendation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1d2129" flood-opacity=".14"/></filter>
    <linearGradient id="brandline" x1="0" x2="1"><stop stop-color="#c026d3"/><stop offset=".5" stop-color="#1c78ff"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
  </defs>
  <g filter="url(#shadow)" transform="translate(40 55)">
    <rect width="1120" height="675" rx="20" fill="#0a0f1f"/>
    <rect width="1120" height="48" rx="20" fill="#1d2129"/>
    <circle cx="27" cy="24" r="6" fill="#ef4444"/><circle cx="49" cy="24" r="6" fill="#f59e0b"/><circle cx="71" cy="24" r="6" fill="#22c55e"/>
    <text x="560" y="30" text-anchor="middle" fill="#d6dae0" font-family="Arial, sans-serif" font-size="13">Deep Diagnostic &amp; Roadmap · Live Walkthrough</text>
    <g transform="translate(24 72)">
      <rect width="780" height="535" rx="12" fill="#fff"/>
      <rect width="780" height="7" fill="url(#brandline)"/>
      <text x="42" y="58" fill="#0f63e0" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">RECOMMENDED NEXT STEP</text>
      <text x="42" y="104" fill="#0a0f1f" font-family="Arial, sans-serif" font-size="28" font-weight="700">What We Would Do in Your Seat</text>
      <text x="42" y="137" fill="#626974" font-family="Arial, sans-serif" font-size="14">A recommendation shaped by the evidence, your resources, and what the team can own.</text>
      <g transform="translate(42 177)" font-family="Arial, sans-serif">
        <rect width="696" height="98" rx="9" fill="#e7f0ff"/>
        <circle cx="42" cy="49" r="22" fill="#0f63e0"/><text x="35" y="57" fill="#fff" font-size="21" font-weight="700">1</text>
        <text x="82" y="39" fill="#0a0f1f" font-size="17" font-weight="700">Use your internal team for the first 90 days</text>
        <text x="82" y="65" fill="#343a44" font-size="14">The capability exists. What is missing is sequence and ownership.</text>
      </g>
      <g transform="translate(42 291)" font-family="Arial, sans-serif">
        <rect width="696" height="98" rx="9" fill="#f4f5f7"/>
        <circle cx="42" cy="49" r="22" fill="#343a44"/><text x="35" y="57" fill="#fff" font-size="21" font-weight="700">2</text>
        <text x="82" y="39" fill="#0a0f1f" font-size="17" font-weight="700">Bring in specialist support only where needed</text>
        <text x="82" y="65" fill="#343a44" font-size="14">Pricing architecture needs outside depth. Content execution does not.</text>
      </g>
      <g transform="translate(42 405)" font-family="Arial, sans-serif">
        <rect width="696" height="76" rx="9" fill="#dcfce7"/>
        <text x="24" y="32" fill="#15803d" font-size="12" font-weight="700" letter-spacing="1.4">WHY THIS PATH</text>
        <text x="24" y="57" fill="#0a0f1f" font-size="16" font-weight="700">It removes the first constraint without creating a larger dependency.</text>
      </g>
    </g>
    <g transform="translate(828 72)" font-family="Arial, sans-serif">
      <rect width="268" height="260" rx="12" fill="#343a44"/>
      <circle cx="134" cy="98" r="54" fill="#626974"/>
      <circle cx="134" cy="82" r="22" fill="#d6dae0"/><path d="M91 142c9-28 29-42 43-42s34 14 43 42" fill="#d6dae0"/>
      <rect x="22" y="205" width="224" height="35" rx="5" fill="#0a0f1f" fill-opacity=".82"/>
      <text x="38" y="227" fill="#fff" font-size="13" font-weight="700">Your Endless Customers Coach</text>
      <g transform="translate(0 282)">
        <rect width="128" height="126" rx="10" fill="#343a44"/>
        <circle cx="64" cy="46" r="25" fill="#626974"/><circle cx="64" cy="40" r="11" fill="#d6dae0"/><path d="M42 70c5-15 14-22 22-22s17 7 22 22" fill="#d6dae0"/>
        <text x="64" y="106" text-anchor="middle" fill="#fff" font-size="12">Leadership</text>
        <rect x="140" width="128" height="126" rx="10" fill="#343a44"/>
        <circle cx="204" cy="46" r="25" fill="#626974"/><circle cx="204" cy="40" r="11" fill="#d6dae0"/><path d="M182 70c5-15 14-22 22-22s17 7 22 22" fill="#d6dae0"/>
        <text x="204" y="106" text-anchor="middle" fill="#fff" font-size="12">Sales</text>
        <rect y="138" width="128" height="126" rx="10" fill="#343a44"/>
        <circle cx="64" cy="184" r="25" fill="#626974"/><circle cx="64" cy="178" r="11" fill="#d6dae0"/><path d="M42 208c5-15 14-22 22-22s17 7 22 22" fill="#d6dae0"/>
        <text x="64" y="244" text-anchor="middle" fill="#fff" font-size="12">Marketing</text>
        <rect x="140" y="138" width="128" height="126" rx="10" fill="#0f63e0"/>
        <path d="M188 201l13 13 27-33" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="204" y="244" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Questions answered</text>
      </g>
    </g>
  </g>
</svg>
