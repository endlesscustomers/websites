          <div className="post-faq">
            <details open>
              <summary><h3>What Is the Deep Diagnostic &amp; Roadmap?</h3><span className="post-faq-icon" aria-hidden="true">+</span></summary>

                <p>It is a complete, standalone engagement. You can implement the roadmap internally, take it elsewhere, or talk with IMPACT about continuing.</p>

                <p>It is one flat fee. There are no surprise add-ons and no requirement to purchase ongoing coaching.</p>

                <p>The AI Marketing Assessment asks 23 questions and provides an instant score in about five minutes. The Website Performance Assessment asks six questions to help you identify common website performance gaps.</p>
                <p>The Deep Diagnostic &amp; Roadmap goes further. IMPACT investigates your business from the outside and the inside, compares you with competitors, speaks with your leadership team, and uses expert judgment to decide what deserves attention first.</p>
                <p>The free assessments help you spot possible gaps. The diagnostic gives you an evidence-backed plan for addressing the ones that matter.</p>
              </div>
            </details>

            <details>
              <summary><h3>What if We Already Have a Marketing Team?</h3><span className="post-faq-icon" aria-hidden="true">+</span></summary>

                <p>The diagnostic is not designed to replace your marketing team or discount what they already know. It gives them outside evidence, a clearer order of operations, and a roadmap they can use to make stronger decisions.</p>

            <details>
              <summary><h3>How Is This Different From an Audit?</h3><span className="post-faq-icon" aria-hidden="true">+</span></summary>

                <p>You do not leave with a longer list of things that might be wrong. You leave knowing what should happen first, what can wait, and what the next year should look like.</p>
              </div>
            </details>

            <details>
              <summary><h3>What Happens on the Explore Call?</h3><span className="post-faq-icon" aria-hidden="true">+</span></summary>
              <div className="post-faq-answer">
                <p>The Explore Call is usually about one hour.</p>
