<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 22px; }
  .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 0 0 10px; }
  .block { margin-bottom: 26px; }
  .dark { background: var(--surface-dark); padding: 18px; border-radius: var(--radius-lg); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Badge, StarRating, Callout, SectionHeading, CheckItem } = window.IMPACTDesignSystem_9efa99;
function Demo() {
  return (
    <div>
      <div className="block">
        <p className="lbl">Buttons</p>
        <div className="row">
          <Button variant="primary" withArrow>Schedule Call</Button>
          <Button variant="dark" withArrow>Learn More</Button>
          <Button variant="secondary">Register Now</Button>
          <Button variant="ghost" withArrow>Explore</Button>
          <Button variant="link" withArrow>Get a Free Chapter of the Book</Button>
        </div>
        <div className="row">
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg" withArrow>Large</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="row dark" style={{ color: "#fff" }}>
          <Button variant="outline" withArrow>Register Now</Button>
          <span style={{ color: "#fff", fontSize: 13 }}>outline uses currentColor on dark bands</span>
        </div>
      </div>

      <div className="block">
        <p className="lbl">Badges &nbsp;•&nbsp; Star rating</p>
        <div className="row">
          <Badge>National Bestseller</Badge>
          <Badge variant="blue">Engagement</Badge>
          <Badge variant="dark">Step 01</Badge>
          <Badge variant="outline">New</Badge>
          <StarRating value={5} />
        </div>
      </div>

      <div className="block">
        <p className="lbl">Checklist</p>
        <CheckItem>You're committed to owning your growth, not outsourcing it.</CheckItem>
        <div style={{ height: 8 }} />
        <CheckItem>You have (or will hire) a content manager.</CheckItem>
      </div>

      <div className="block">
        <p className="lbl">Handwritten call-out</p>
        <div className="row">
          <Callout arrow="down-right" size="lg">1. Learn the System</Callout>
          <Callout size="md" color="var(--color-brand)">made me a millionaire</Callout>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
