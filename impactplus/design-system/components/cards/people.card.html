<!-- @dsCard group="Components" viewport="820x520" name="People, Insights & Stats" subtitle="Team role cards, Learning-Center blog cards, and stat callouts" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:28px;background:var(--surface-muted);font-family:var(--font-body)}.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin:0 0 14px}.block{margin-bottom:30px}.grid{display:grid;gap:20px;align-items:stretch}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { TeamCard, BlogCard, StatCallout } = window.IMPACTDesignSystem_9efa99;
const PHOTO = "https://www.impactplus.com/hubfs/impact_site_2025_IM-UI/assets/homepage/Homepage_Featured_image.jpg";
function Demo(){
  return (
    <div>
      <div className="block"><p className="lbl">Team roles</p>
        <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
          <TeamCard role="Coaches">Guide your leadership through the Endless Customers System.</TeamCard>
          <TeamCard role="Trainers">Level up your marketing and sales teams' skills.</TeamCard>
          <TeamCard role="Website Strategists">Turn your site into your best sales asset.</TeamCard>
        </div>
      </div>
      <div className="block"><p className="lbl">Learning Center cards</p>
        <div className="grid" style={{gridTemplateColumns:"repeat(2,1fr)"}}>
          <BlogCard image={PHOTO} title="How to Win Customers in the Age of AI" date="July 15, 2026" author={{name:"Bob Ruffolo"}}/>
          <BlogCard image={PHOTO} title="Can Endless Customers Help Me Get Recommended by AI?" date="July 20, 2026" author={{name:"Allison Riggs"}}/>
        </div>
      </div>
      <div className="block"><p className="lbl">Stat callouts</p>
        <div style={{display:"flex",gap:56}}>
          <StatCallout value="7x" label="revenue growth in three years"/>
          <StatCallout value="70%" color="var(--ec-green-600)" label="close rate after coaching"/>
          <StatCallout value="1,500" label="leads a month" script/>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
