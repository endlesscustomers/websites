<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="White→Black — surfaces, dividers & content headers" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}
.row{display:flex;gap:10px}.chip{flex:1;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle);min-width:0}
.c{height:60px}.m{padding:7px 9px;line-height:1.3}.n{font-weight:700;font-size:12px;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h{font-size:11px;color:var(--text-muted);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="chip"><div class="c" style="background:#FFFFFF"></div><div class="m"><div class="n">White</div><div class="h">#FFFFFF</div></div></div><div class="chip"><div class="c" style="background:#F6F6F6"></div><div class="m"><div class="n">N-100</div><div class="h">#F6F6F6</div></div></div><div class="chip"><div class="c" style="background:#EEEEEE"></div><div class="m"><div class="n">N-200</div><div class="h">#EEEEEE</div></div></div><div class="chip"><div class="c" style="background:#DDDDDD"></div><div class="m"><div class="n">N-300</div><div class="h">#DDDDDD</div></div></div><div class="chip"><div class="c" style="background:#C4C4C4"></div><div class="m"><div class="n">N-400</div><div class="h">#C4C4C4</div></div></div><div class="chip"><div class="c" style="background:#999999"></div><div class="m"><div class="n">N-500</div><div class="h">#999999</div></div></div><div class="chip"><div class="c" style="background:#1D1D1F"></div><div class="m"><div class="n">N-700</div><div class="h">#1D1D1F</div></div></div><div class="chip"><div class="c" style="background:#000000"></div><div class="m"><div class="n">Black</div><div class="h">#000000</div></div></div></div></body></html>
