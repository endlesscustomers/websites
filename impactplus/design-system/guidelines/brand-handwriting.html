<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;font-family:var(--font-body);background:var(--surface-page)}
.wrap{display:flex;gap:50px;align-items:flex-start}
.ann{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.k{font-family:var(--font-script);font-weight:700;line-height:1.1}
.arrow{opacity:.9}</style></head>
<body><div class="wrap">
<div class="ann"><span class="k" style="font-size:30px;color:var(--text-heading)">1. Learn the System</span>
<svg class="arrow" width="60" height="46" viewBox="0 0 52 40" fill="none" stroke="var(--text-heading)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(45deg)"><path d="M4 6 C 18 4, 34 12, 44 30"/><polyline points="34 26 45 32 40 20"/></svg></div>
<div class="ann"><span class="k" style="font-size:34px;color:var(--color-brand)">made me a millionaire</span></div>
<div class="ann"><span class="k" style="font-size:52px;color:var(--ec-green-600)">82%</span><span style="font-size:13px;color:var(--text-muted)">stat callout</span></div>
</div></body></html>
