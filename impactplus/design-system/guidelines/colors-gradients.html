<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body)}
.row{display:flex;gap:10px}.chip{flex:1;border-radius:10px;overflow:hidden;border:1px solid var(--border-subtle);min-width:0}
.c{height:60px}.m{padding:7px 9px;line-height:1.3}.n{font-weight:700;font-size:12px;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h{font-size:11px;color:var(--text-muted);font-family:ui-monospace,monospace}</style></head><body><div class="row"><div class="chip"><div class="c" style="height:90px;background:var(--ec-grad-sales-dark)"></div><div class="m"><div class="n">Sales</div></div></div><div class="chip"><div class="c" style="height:90px;background:var(--ec-grad-hubspot-dark)"></div><div class="m"><div class="n">HubSpot</div></div></div><div class="chip"><div class="c" style="height:90px;background:var(--ec-grad-website-dark)"></div><div class="m"><div class="n">Website</div></div></div><div class="chip"><div class="c" style="height:90px;background:var(--ec-grad-ai-dark)"></div><div class="m"><div class="n">AI</div></div></div><div class="chip"><div class="c" style="height:90px;background:var(--ec-grad-marketing-dark)"></div><div class="m"><div class="n">Marketing</div></div></div><div class="chip"><div class="c" style="height:90px;background:var(--ec-grad-ai-chat)"></div><div class="m"><div class="n">Ecee Chat</div></div></div></div></body></html>
