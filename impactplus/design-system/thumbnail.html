<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--ec-blue-600);display:flex;align-items:center;justify-content:center;padding:0 90px}
  .main img{width:74%;max-width:760px}
  .strip{width:150px;display:flex;flex-direction:column}
  .strip span{flex:1}
</style></head>
<body>
<div class="tile">
  <div class="main">
    <img src="https://www.impactplus.com/hubfs/IMPACT%20Style%20and%20Branding%20Assets/White%20Logo%20-%20Full/IMPACT-Logo--White-Full.png" alt="IMPACT">
  </div>
  <div class="strip">
    <span style="background:#01E6BE"></span>
    <span style="background:#02B4CA"></span>
    <span style="background:#E4319A"></span>
    <span style="background:#00B59C"></span>
  </div>
</div>
</body></html>
